name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development-only values. Real secrets never live in CI config.
  CI_JWT_SECRET: ci-access-token-secret-value-32-characters
  CI_DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_ci?schema=public
  # Prisma 7 loads this variable even for schema-only validate/generate commands.
  DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_ci?schema=public

jobs:
  # ---------------------------------------------------------------------------
  static:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, never committed, so types depend on it.
      - name: Prisma validate
        run: pnpm --filter backend exec prisma validate
      - name: Prisma generate
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck (contracts, backend, frontend)
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Backend unit tests
        run: pnpm --filter backend test -- --ci --coverage
      - name: Backend HTTP-layer tests
        run: pnpm --filter backend test:e2e -- --ci
      - name: Frontend tests
        run: pnpm --filter frontend test -- --ci --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/backend/coverage
            apps/frontend/coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Migrations from an empty database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Migrations are complete (schema matches the migration history)
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          pnpm --filter backend exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code && echo "schema and database agree"

      - name: Upgrade path from the pre-V1 schema, with data
        run: |
          PGPASSWORD=finance psql -h localhost -U finance -d postgres -c "DROP DATABASE IF EXISTS finance_upgrade_ci"
          PGPASSWORD=finance psql -h localhost -U finance -d postgres -c "CREATE DATABASE finance_upgrade_ci"
          DATABASE_URL=postgresql://finance:finance@localhost:5432/finance_upgrade_ci?schema=public \
            node apps/backend/test/migrations/upgrade-check.mjs

      - name: Seed is idempotent (runs twice, same result)
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          pnpm db:seed
          BEFORE=$(PGPASSWORD=finance psql -h localhost -U finance -d finance_ci -tAc "SELECT count(*) FROM transactions")
          pnpm db:seed
          AFTER=$(PGPASSWORD=finance psql -h localhost -U finance -d finance_ci -tAc "SELECT count(*) FROM transactions")
          echo "transactions: $BEFORE -> $AFTER"
          test "$BEFORE" = "$AFTER"

      - name: Integration tests against real PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_ci?schema=public
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  build-and-smoke:
    name: Build and smoke the production artifact
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_smoke_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Build backend
        run: pnpm build:backend

      - name: Verify backend entrypoint exists
        run: test -f apps/backend/dist/main.js

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: pnpm build:frontend

      # Runs EXACTLY dist/main.js against an explicitly disposable database.
      # The same command uses embedded PostgreSQL 16 on developer machines.
      - name: Smoke the production artifact
        env:
          SMOKE_DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_smoke_ci?schema=public
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
        run: pnpm test:smoke

  # ---------------------------------------------------------------------------
  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium

      - name: Migrate
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_e2e?schema=public
        run: pnpm db:migrate

      - name: Run browser E2E
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_e2e?schema=public
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          CORS_ORIGINS: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          ENABLE_CRON: 'false'
        run: pnpm test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the job on high/critical advisories; moderate ones are reported.
      - run: pnpm audit --audit-level high
      - run: pnpm audit --audit-level moderate || true
